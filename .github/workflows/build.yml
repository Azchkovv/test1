name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - name: Unzip and patch project
        run: |
          unzip -q ./*.zip
          cd ShizukuDataCleaner
          printf '%s\n' 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' 'dependencyResolutionManagement { repositories { google(); mavenCentral() } }' 'rootProject.name = "ShizukuDataCleaner"' 'include(":app")' > settings.gradle.kts
          sed -i 's/kotlinCompilerExtensionVersion = "1.5.5"/kotlinCompilerExtensionVersion = "1.5.4"/' app/build.gradle.kts
      - name: Build
        run: cd ShizukuDataCleaner && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShizukuDataCleaner-apk
          path: ShizukuDataCleaner/app/build/outputs/apk/debug/*.apk
